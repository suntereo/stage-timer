name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip when Cloudflare secrets are missing
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets to enable deploys."

      # Stamp the service worker cache with the commit so installed phones always pick up the new version.
      - name: Stamp cache version
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: sed -i "s/stage-timer-v[0-9A-Za-z]*/stage-timer-${GITHUB_SHA::7}/" sw.js

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual deploy' }}
        run: >
          npx --yes wrangler@latest pages deploy . --project-name stage-timer --branch main
          --commit-hash "$GITHUB_SHA" --commit-message "${COMMIT_MSG%%$'\n'*}"
          --commit-dirty=true
